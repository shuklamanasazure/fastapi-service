apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fastapi-service
spec:
  ingressClassName: nginx
  rules:
  - host: "fastapi-service.test.com"
    http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: fastapi-service
              port:
                number: 8080